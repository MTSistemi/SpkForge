name: spksrc recipe

# Builds the zt-syno-net recipe the way SynoCommunity will: inside the official
# spksrc tree and Docker image, with Synology's toolchains. Prints the digests
# of the ZeroTier source so they can be committed to cross/zerotier/digests.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'contrib/spksrc/**'
      - '.github/workflows/spksrc.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64-7.1, aarch64-7.1, armv7-7.1, evansport-7.1, x64-7.2]
    steps:
      - uses: actions/checkout@v4
        with:
          path: spkforge
      - uses: actions/checkout@v4
        with:
          repository: SynoCommunity/spksrc
          ref: master
          path: spksrc
      - name: Add the recipe to the spksrc tree
        run: |
          cp -r spkforge/contrib/spksrc/cross/zerotier spksrc/cross/
          cp -r spkforge/contrib/spksrc/spk/zt-syno-net spksrc/spk/
      - name: Build zt-syno-net for ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD/spksrc:/spksrc" -w /spksrc ghcr.io/synocommunity/spksrc:latest bash -c '
            set -e
            make setup >/dev/null
            if [ ! -s cross/zerotier/digests ]; then make -C cross/zerotier digests; fi
            echo "----- cross/zerotier/digests"; cat cross/zerotier/digests; echo "-----"
            make -C spk/zt-syno-net arch-${{ matrix.arch }}
          '
      - name: Show the package
        run: |
          ls -l spksrc/packages/
          for f in spksrc/packages/*.spk; do
            echo "== $f"; tar -tvf "$f"; tar -xOf "$f" INFO
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spksrc-zt-syno-net-${{ matrix.arch }}
          path: |
            spksrc/packages/*.spk
            spksrc/cross/zerotier/digests
            spksrc/spk/zt-syno-net/work-*/*.log
          if-no-files-found: warn
